<style>:root{--bg:#faf7f4;--card:#fff;--ink:#2b2523;--mute:#8a7f7a;--acc:#b5546b;--soft:#f6eef0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px;text-wrap:balance}.lead{color:var(--mute);margin:0 0 20px;text-wrap:balance}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 28px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tabs a{display:block;background:var(--acc);color:#fff;text-decoration:none;border-radius:12px;padding:12px 10px;text-align:center}
.tabs b{display:block;font-size:15px;line-height:1.2}.tabs span{font-size:12px;opacity:.85}
section{scroll-margin-top:90px}h3{font-size:24px;margin:32px 0 4px}h3 a{color:var(--ink);text-decoration:none}
article{display:flex;gap:14px;background:var(--card);border-radius:14px;padding:16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.05);scroll-margin-top:90px}
.num{flex:0 0 40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.body{min-width:0;flex:1}h2{font-size:18px;margin:4px 0 4px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin:0 0 10px;color:var(--mute);font-size:14px}.meta b{color:var(--ink)}.meta a{color:var(--acc)}
.vid{max-width:400px;margin:0 0 10px;border-radius:12px;overflow:hidden;background:var(--soft)}
.vid iframe{display:block;width:100%;height:700px;border:0}
details{margin:6px 0 0}details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px}
p{margin:8px 0 0;text-wrap:pretty}details p{font-size:15px;color:#4a413e}.mute{color:var(--mute);font-size:14px;margin-top:24px}
@media (max-width:600px){.tabs{grid-template-columns:repeat(2,1fr);gap:6px}.tabs a{padding:8px 6px}}
@media (max-width:420px){article{display:block;padding:14px}.num{width:auto;height:auto;display:inline-block;padding:2px 10px;border-radius:12px;margin:0 0 6px}.vid iframe{height:620px}.tabs b{font-size:13px}h1{font-size:26px}}

.panel{position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 0 12px;margin:0 0 16px;border-bottom:1px solid #eadfd9}
.panel label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel select{width:100%;font:600 15px Manrope,system-ui,sans-serif;color:var(--ink);background:#fff;border:1px solid #e3d6d0;border-radius:10px;padding:10px 12px}
.count{font-size:14px;color:var(--mute);margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 10px}
.stats div{background:var(--soft);border-radius:10px;padding:8px 10px;min-width:0}
.stats b{display:block;font-size:16px;line-height:1.2}.stats span{font-size:12px;color:var(--mute)}
.stats i{font-style:normal;color:var(--acc);font-weight:700;font-size:13px}
.stats .on{outline:2px solid var(--acc)}
.who{font-size:14px;color:var(--mute);margin:0 0 4px}.who a{color:var(--ink);font-weight:700;text-decoration:none}
.tags{font-size:12px;color:var(--mute);margin:0 0 6px}
.more{display:block;width:100%;margin:8px 0 0;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:700 16px Manrope,system-ui,sans-serif;cursor:pointer}
.mx{margin:12px 0 0;border:1px solid #eadfd9;border-radius:14px;background:#fff}
.mx>summary{padding:12px 14px;font-weight:800;color:var(--acc);cursor:pointer}
.mxb{padding:0 14px 14px}
.mxb h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
.cell{background:var(--soft);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.cell .lab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin:0 0 4px}
.cell .lab button{border:0;background:none;color:var(--acc);font:700 12px Manrope,system-ui,sans-serif;cursor:pointer;padding:0}
.cell p{margin:0 0 8px;font-size:15px;line-height:1.5}.cell p:last-child{margin:0}
@media (max-width:420px){.panel select{font-size:14px;padding:9px 8px}.panel label{font-size:12px}.stats b{font-size:15px}}
.tags a{color:var(--acc)}
