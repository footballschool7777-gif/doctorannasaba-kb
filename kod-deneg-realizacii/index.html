<script>
(function(){
"use strict";
var C = CONFIG, $app = document.getElementById('app');
var params = new URLSearchParams(location.search);
var DEBUG = params.get('debug') === '1';
var SKEY = 'kd_quiz_state_v1', TKEY = 'kd_offer_end_v1';
var BRANCHES = C.q1_branch.options.map(function(o){ return o.branch; });

/* ---------- Типографика: неразрывные пробелы при выводе ---------- */
var NB = ' ';
var SHORT = /(^|[\s «("„])(в|к|с|у|о|и|а|я|на|не|по|за|от|до|из|об|во|со|ко|но|же|ли|бы)\s+/gi;
function typo(s){
  if (s == null) return '';
  s = String(s);
  // после коротких предлогов/союзов (повторно – для цепочек «и на себя»)
  for (var k = 0; k < 2; k++) s = s.replace(SHORT, function(m, pre, w){ return pre + w + NB; });
  // тире не начинает строку
  s = s.replace(/\s+([–—])/g, NB + '$1');
  // связываем два последних слова; если хвост короткий – три
  var words = s.split(' ');
  if (words.length > 2) {
    var last = words.pop(), prev = words.pop();
    var tail = prev + NB + last;
    if (tail.replace(/[^\wа-яё]/gi,'').length < 12 && words.length > 1) tail = words.pop() + NB + tail;
    words.push(tail); s = words.join(' ');
  } else if (words.length === 2) s = words.join(NB);
  return s;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nw(h){ return h.replace(/([^\s\u00A0<>]+-[^\s\u00A0<>]+)/g, '<span class="nw">$1</span>'); } // слово через дефис не рвётся
function T(s){ return nw(esc(typo(s))); }

/* ---------- Аналитика (пока console.log) ---------- */
function track(name, data){ console.log('[analytics]', name, data || ''); }

/* ---------- Состояние ---------- */
var state = load() || { step: 'intro', branch: null, answers: [] };
function load(){ try { return JSON.parse(sessionStorage.getItem(SKEY)); } catch(e){ return null; } }
function save(){ try { sessionStorage.setItem(SKEY, JSON.stringify(state)); } catch(e){} }

var TOTAL = 1 + 7;
function qIndex(step){ return /^q\d$/.test(step) ? +step.slice(1) : -1; }
function questionData(i){
  if (i === 0) return { text: C.q1_branch.text, options: C.q1_branch.options.map(function(o){ return o.text; }) };
  var q = C.branches[state.branch || BRANCHES[0]][i-1];
  return { text: q.text, options: q.answers.map(function(a){ return a.text; }) };
}

/* ---------- Подсчёт ---------- */
function computeResult(){
  var br = state.branch || BRANCHES[0], qs = C.branches[br], keys = [];
  for (var i = 1; i <= 7; i++) { var a = state.answers[i]; if (a != null) keys.push(qs[i-1].answers[a].key); }
  var cnt = { S:0, U:0, P:0, N:0 };
  keys.forEach(function(k){ cnt[k]++; });
  var type;
  if (cnt.N >= C.calm_min) type = 'N';
  else {
    var max = Math.max(cnt.S, cnt.U, cnt.P);
    var tied = ['S','U','P'].filter(function(k){ return cnt[k] === max; });
    if (tied.length === 1) type = tied[0];
    else { for (var j = keys.length - 1; j >= 0; j--) if (tied.indexOf(keys[j]) >= 0) { type = keys[j]; break; } }
    if (!type) type = tied[0];
  }
  var data = type === 'P' ? C.results.P_by_branch[br] : C.results[type];
  return { type: type, code: type === 'P' ? 'P_' + br : type, data: data, counts: cnt };
}

/* ---------- Иконки ---------- */
var ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="#2B211D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z" fill="#A3432E"/></svg>',
  person: '<svg viewBox="0 0 32 32"><circle cx="16" cy="12" r="6" fill="#FFF3EC"/><path d="M4 32c1-7 6-11 12-11s11 4 12 11z" fill="#FFF3EC"/></svg>'
};

/* ---------- Рендер ---------- */
var timers = [];
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function go(step){
  clearTimers();
  state.step = step; save();
  var isResult = step === 'result';
  document.body.classList.toggle('locked', !isResult);
  document.getElementById('sticky').classList.remove('show');
  if (step === 'intro') renderIntro();
  else if (qIndex(step) >= 0) renderQuestion(qIndex(step));
  else if (step[0] === 'L') renderLoader(step.slice(1).toLowerCase());
  else if (isResult) renderResult();
  window.scrollTo(0, 0);
  if (DEBUG) { updateDebug(); requestAnimationFrame(function(){ checkOverflow(true); }); }
}
function next(){ var i = C.flow.indexOf(state.step); go(C.flow[Math.min(i + 1, C.flow.length - 1)]); }

function renderIntro(){
  var I = C.intro;
  $app.innerHTML =
    '<section class="screen intro" data-screen="Экран 1">' +
      '<div class="author"><span class="avatar" aria-hidden="true">' + ICON.person + '</span>' +
        '<span class="author-name">' + T(I.brand) + '</span>' +
        '<span class="badge">' + T(I.kicker) + '</span></div>' +
      '<span class="badge">' + T(I.kicker) + '</span>' +
      '<div class="test-name">' + T(I.test_name) + '</div>' +
      '<h1 class="h1">' + T(I.h1) + '</h1>' +
      '<div class="pains-title">' + T(I.pains_title) + '</div>' +
      '<ul class="pains">' + I.pains.map(function(p){ return '<li>' + T(p) + '</li>'; }).join('') + '</ul>' +
      '<div class="paras">' + I.paras.map(function(p){ return '<p>' + T(p) + '</p>'; }).join('') + '</div>' +
      '<div class="spacer"></div>' +
      '<button class="btn" id="start" type="button">' + T(I.start) + '</button>' +
      '<div class="note">' + T(I.note) + '</div>' +
    '</section>';
  document.getElementById('start').onclick = function(){ track('quiz_start'); state.answers = []; state.branch = null; go('q0'); };
}

function renderQuestion(i){
  var q = questionData(i), n = i + 1;
  var pct = Math.round((n - 0.5) / TOTAL * 100); // прогресс стартует не с нуля
  var chosen = state.answers[i];
  $app.innerHTML =
    '<section class="screen qscreen" data-screen="Вопрос ' + n + '">' +
      '<div class="topbar">' +
        '<button class="back' + (i === 0 ? ' hidden' : '') + '" type="button" aria-label="' + esc(C.ui.back_aria) + '" id="back">' + ICON.back + '</button>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<span class="count">' + esc(C.ui.progress.replace('{n}', n).replace('{total}', TOTAL)) + '</span>' +
      '</div>' +
      '<h2 class="question">' + T(q.text) + '</h2>' +
      '<div class="options" role="radiogroup">' + q.options.map(function(o, k){
        return '<button type="button" role="radio" aria-checked="' + (chosen === k) + '" class="opt' + (chosen === k ? ' sel' : '') + '" data-k="' + k + '">' +
          '<span class="dot" aria-hidden="true"></span><span class="txt">' + T(o) + '</span></button>';
      }).join('') + '</div>' +
    '</section>';
  if (i > 0) document.getElementById('back').onclick = function(){ go('q' + (i - 1)); };
  var locked = false;
  Array.prototype.forEach.call($app.querySelectorAll('.opt'), function(el){
    el.onclick = function(){
      if (locked) return; locked = true;
      var k = +el.getAttribute('data-k');
      Array.prototype.forEach.call($app.querySelectorAll('.opt'), function(o){ o.classList.remove('sel'); o.setAttribute('aria-checked','false'); });
      el.classList.add('sel'); el.setAttribute('aria-checked','true');
      if (i === 0) {
        var br = C.q1_branch.options[k].branch;
        if (state.branch !== br) state.answers = [];
        state.branch = br;
      }
      state.answers[i] = k; save();
      track('q' + n + '_answer', i === 0 ? { branch: state.branch } : { key: C.branches[state.branch][i-1].answers[k].key });
      timers.push(setTimeout(next, C.timing.autoadvance_ms));
    };
  });
}

function renderLoader(key){
  var L = C.loaders[key], dur = C.timing.loaders[key] || 2000;
  $app.innerHTML =
    '<section class="screen loader" data-screen="Загрузка ' + key + '">' +
      '<div class="spin" aria-hidden="true"></div>' +
      '<h2>' + T(L.title) + '</h2>' +
      (L.lines.length ? '<ul class="checks">' + L.lines.map(function(l){
        return '<li><span class="ck">' + ICON.check + '</span><span>' + T(l) + '</span></li>'; }).join('') + '</ul>' : '') +
    '</section>';
  var items = $app.querySelectorAll('.checks li');
  var stepT = dur / (items.length + 1);
  Array.prototype.forEach.call(items, function(li, idx){ timers.push(setTimeout(function(){ li.classList.add('on'); }, stepT * (idx + 1) - 150)); });
  if (!window.__noAutoAdvance) timers.push(setTimeout(next, dur));
}

/* ---------- Результат ---------- */
function withUtm(url){
  if (!/^https?:\/\//i.test(url)) return null; // заглушка [URL]
  try {
    var u = new URL(url);
    params.forEach(function(v, k){ if (/^utm_/i.test(k)) u.searchParams.set(k, v); });
    return u.toString();
  } catch(e){ return null; }
}
function linkAttrs(url){
  var h = withUtm(url);
  return h ? 'href="' + esc(h) + '"' : 'href="#" data-placeholder="1"';
}
function isPlaceholder(s){ return !s || /^\s*\[.*\]\s*$/.test(s); }
function boldPrefix(s){ // «Как это изменить:» / «После практикума:» – жирным, текст не меняется
  var t = typo(s), i = t.indexOf(':');
  return i > 0 ? '<b>' + nw(esc(t.slice(0, i + 1))) + '</b>' + nw(esc(t.slice(i + 1))) : nw(esc(t));
}

function renderResult(){
  var R = computeResult(), D = R.data;
  var how = C.how_prefix + D.key.replace(/^на практикуме /, '');
  var cards = D.cards.slice(0, 3).map(function(c, i){
    return '<article class="card"><div class="c-label"><span class="c-num">' + (i + 1) + '</span>' + T(c[0]) + '</div>' +
      '<h3 class="c-title">' + T(c[1]) + '</h3><p class="c-text">' + T(c[2]) + '</p></article>';
  }).join('');
  var lockedCard = D.cards[3];
  $app.innerHTML =
    '<main class="result"><div class="col">' +
      '<div class="r-kicker">' + T(C.ui.result_kicker) + '</div>' +
      '<h1 class="r-name">«' + T(D.name) + '»:</h1>' +
      '<p class="r-sub">' + T(D.sub) + '</p>' +
      '<button class="video" id="video" type="button" aria-label="Видео"><span class="play">' + ICON.play + '</span></button>' +
      (isPlaceholder(C.ui.video_caption) ? '' : '<div class="v-caption">' + T(C.ui.video_caption) + '</div>') +
      '<div class="cards">' + cards + '</div>' +
      '<section class="offer" id="offer">' +
        '<h2>' + T(C.ui.offer_title) + '</h2>' +
        '<div class="lockcard"><span class="lock" aria-hidden="true">' + ICON.lock + '</span>' +
          '<div class="c-label"><span class="c-num">4</span>' + T(lockedCard[0]) + '</div>' +
          '<h3 class="c-title">' + T(lockedCard[1]) + '</h3>' +
          '<div class="blur" aria-hidden="true"><i style="width:96%"></i><i style="width:88%"></i><i style="width:93%"></i><i style="width:60%"></i></div>' +
        '</div>' +
        '<p>' + boldPrefix(how) + '</p>' +
        '<p>' + T(C.practicum_line) + '</p>' +
        '<p class="reality"><span class="ck">' + ICON.check + '</span><span>' + boldPrefix(D.reality) + '</span></p>' +
        (C.ui.promo_label ? '<div class="mini-label">' + T(C.ui.promo_label) + '</div>' : '') +
        '<div class="promo"><span class="promo-code" id="promo">' + esc(C.ui.promo_code) + '</span>' +
          '<button class="copy" id="copy" type="button">' + esc(C.ui.copy_btn) + '</button></div>' +
        (C.ui.timer_label ? '<div class="mini-label" style="text-align:center">' + T(C.ui.timer_label) + '</div>' : '') +
        '<div class="timer" data-timer>10:00</div>' +
        '<div class="timer-exp" id="timerExp" hidden></div>' +
        '<a class="btn" id="ctaMain" ' + linkAttrs(C.links.cta_main) + '>' + T(C.ui.cta_main) + '</a>' +
        '<a class="btn secondary" id="ctaSec" ' + linkAttrs(C.links.cta_secondary) + '>' + T(C.ui.cta_secondary) + '</a>' +
      '</section>' +
    '</div></main>';

  track('result_view_' + R.code);
  if (!localStorage.getItem(TKEY)) localStorage.setItem(TKEY, String(Date.now() + C.timing.timer_seconds * 1000));
  startTimer();

  document.getElementById('video').onclick = function(){ track('video_click'); };
  document.getElementById('copy').onclick = function(){
    var btn = this; track('promo_copy');
    var done = function(){ btn.textContent = C.ui.copied; setTimeout(function(){ btn.textContent = C.ui.copy_btn; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(C.ui.promo_code).then(done, function(){ fallbackCopy(); done(); });
    else { fallbackCopy(); done(); }
  };
  function placeholderGuard(e){ if (this.getAttribute('data-placeholder')) { e.preventDefault(); console.warn('Ссылка ещё не задана в CONFIG.links'); } }
  var m = document.getElementById('ctaMain'), s = document.getElementById('ctaSec');
  m.addEventListener('click', function(e){ track('cta_main_click'); placeholderGuard.call(this, e); });
  s.addEventListener('click', function(e){ track('cta_secondary_click'); placeholderGuard.call(this, e); });
  setupSticky();
}
function fallbackCopy(){
  var ta = document.createElement('textarea'); ta.value = C.ui.promo_code; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove();
}

var timerInt = null;
function startTimer(){
  clearInterval(timerInt);
  var tick = function(){
    var end = +localStorage.getItem(TKEY) || Date.now();
    var left = Math.max(0, Math.round((end - Date.now()) / 1000));
    var txt = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    Array.prototype.forEach.call(document.querySelectorAll('[data-timer]'), function(el){ el.textContent = txt; });
    var exp = document.getElementById('timerExp');
    if (left === 0) {
      clearInterval(timerInt);
      if (exp && C.ui.timer_expired_text) { exp.hidden = false; exp.textContent = typo(C.ui.timer_expired_text); }
    }
  };
  tick(); timerInt = setInterval(tick, 1000);
}

var stickyObs = [];
function setupSticky(){
  stickyObs.forEach(function(o){ o.disconnect(); }); stickyObs = [];
  var bar = document.getElementById('sticky'), btn = document.getElementById('stickyBtn');
  btn.textContent = typo(C.ui.cta_main);
  btn.onclick = function(){ track('cta_main_click', { from: 'sticky' }); document.getElementById('offer').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  var videoPassed = false, offerVisible = false;
  var upd = function(){ var on = videoPassed && !offerVisible; bar.classList.toggle('show', on); bar.setAttribute('aria-hidden', String(!on)); };
  if (!('IntersectionObserver' in window)) return;
  var vo = new IntersectionObserver(function(es){ es.forEach(function(e){ videoPassed = !e.isIntersecting && e.boundingClientRect.bottom < 0; }); upd(); });
  var oo = new IntersectionObserver(function(es){ es.forEach(function(e){ offerVisible = e.isIntersecting; }); upd(); }, { threshold: 0.01 });
  vo.observe(document.getElementById('video')); oo.observe(document.getElementById('offer'));
  stickyObs = [vo, oo];
}

/* ---------- Debug ?debug=1 ---------- */
function checkOverflow(log){
  var el = $app.querySelector('.screen'); if (!el) return null;
  var diff = el.scrollHeight - el.clientHeight;
  var hdiff = document.documentElement.scrollWidth - document.documentElement.clientWidth;
  el.classList.toggle('overflow', diff > 0 || hdiff > 0);
  var name = el.getAttribute('data-screen');
  if (log && diff > 0) console.warn('Экран ' + name + ' переполнен на ' + diff + ' px');
  if (log && hdiff > 0) console.warn('Экран ' + name + ' шире окна на ' + hdiff + ' px');
  if (DEBUG && log) { var lg = document.getElementById('dbgLog'); if (lg) lg.textContent = (diff > 0 ? name + ': переполнен на ' + diff + ' px' : name + ': OK (' + el.scrollHeight + '/' + el.clientHeight + ')'); }
  return { screen: name, scrollHeight: el.scrollHeight, clientHeight: el.clientHeight, overflow: diff, hOverflow: hdiff };
}
function passAs(type, branch){
  branch = branch || state.branch || BRANCHES[0];
  state.branch = branch;
  state.answers = [BRANCHES.indexOf(branch)];
  for (var i = 1; i <= 7; i++) {
    var ans = C.branches[branch][i-1].answers;
    for (var k = 0; k < ans.length; k++) if (ans[k].key === type) { state.answers[i] = k; break; }
  }
  go('result');
}
function updateDebug(){
  var s = document.getElementById('dbgStep'); if (s) s.value = state.step;
  var b = document.getElementById('dbgBranch'); if (b && state.branch) b.value = state.branch;
}
function buildDebug(){
  var d = document.createElement('details'); d.className = 'dbg'; d.open = params.get('panel') !== '0';
  d.innerHTML = '<summary>debug</summary>' +
    '<div>Ветка: <select id="dbgBranch">' + BRANCHES.map(function(b, i){ return '<option value="' + b + '">' + (i + 1) + ' – ' + b + '</option>'; }).join('') + '</select></div>' +
    '<div>Экран: <select id="dbgStep">' + C.flow.map(function(s){ return '<option>' + s + '</option>'; }).join('') + '</select></div>' +
    '<div>' + ['S','U','P','N'].map(function(t){ return '<button data-t="' + t + '">Пройти как ' + t + '</button>'; }).join('') + '</div>' +
    '<div><button id="dbgReset">Сброс</button><button id="dbgTimer">Таймер → 0:05</button></div>' +
    '<div class="log" id="dbgLog"></div>';
  document.body.appendChild(d);
  var bsel = document.getElementById('dbgBranch');
  bsel.onchange = function(){ state.branch = bsel.value; state.answers[0] = BRANCHES.indexOf(bsel.value); save(); if (qIndex(state.step) > 0) go(state.step); };
  document.getElementById('dbgStep').onchange = function(){ if (!state.branch) { state.branch = bsel.value; state.answers[0] = BRANCHES.indexOf(bsel.value); } go(this.value); };
  Array.prototype.forEach.call(d.querySelectorAll('[data-t]'), function(btn){ btn.onclick = function(){ passAs(btn.getAttribute('data-t'), bsel.value); }; });
  document.getElementById('dbgReset').onclick = function(){ sessionStorage.removeItem(SKEY); localStorage.removeItem(TKEY); state = { step: 'intro', branch: null, answers: [] }; go('intro'); };
  document.getElementById('dbgTimer').onclick = function(){ localStorage.setItem(TKEY, String(Date.now() + 5000)); startTimer(); };
  window.addEventListener('resize', function(){ checkOverflow(true); });
}

/* Для автотестов и отладки */
window.QUIZ = { go: go, passAs: passAs, checkOverflow: checkOverflow, computeResult: computeResult, typo: typo,
  state: function(){ return state; }, setBranch: function(b){ state.branch = b; state.answers[0] = BRANCHES.indexOf(b); save(); } };

if (DEBUG) buildDebug();
if (C.flow.indexOf(state.step) < 0 || (state.step !== 'intro' && state.step !== 'q0' && !state.branch)) state.step = 'intro';
go(state.step);
})();
</script>
