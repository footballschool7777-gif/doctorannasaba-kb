<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIP-участие · Практикум Анны Саба</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ft:'Unbounded',sans-serif;--fb:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;--bg:#f6f0e6;--card:#fffdf8;--line:rgba(138,92,24,.2);--ink:#23190d;--muted:#5f5446;--gold:#d6a24a;--gold2:#b9832e;--goldt:#8a5714;--btnink:#2a1c06}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 80% at 80% 0%,#fbf5ea,#f6f0e6 60%,#efe6d6);color:var(--ink);font:500 16px/1.55 var(--fb);min-height:100svh}
.k{display:inline-flex;align-items:center;gap:10px;font:700 11px var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--goldt)}
.k:before{content:"";width:26px;height:2px;border-radius:2px;background:var(--gold2)}
h1{font:600 clamp(22px,3.6vw,34px)/1.22 var(--ft);color:var(--ink);text-wrap:balance}
h1 em{font-style:normal;color:var(--gold2)}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;background:linear-gradient(135deg,#f6dc9e,#c9953f);color:var(--btnink);font:700 13px var(--fb)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 16px 16px 26px;border-radius:99px;background:linear-gradient(135deg,#f6dc9e,#d6a24a 55%,#b9832e);color:var(--btnink);font:700 17px var(--fb);text-decoration:none;white-space:nowrap;box-shadow:0 14px 30px -12px rgba(185,131,46,.6);transition:transform .25s}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn .tg{width:22px;height:22px;flex:0 0 auto}
.btn i{width:38px;height:38px;border-radius:50%;background:#1b1711;display:grid;place-items:center;color:var(--gold)}
.btn i svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.w{min-height:100svh;display:flex;align-items:center;max-width:1080px;margin:0 auto;padding:clamp(28px,6vw,72px) 16px}
.hero{width:100%;display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(20px,4vw,48px);align-items:center}
h1{font-size:clamp(26px,4.2vw,46px);line-height:1.12}
.lead{color:var(--muted);margin-top:14px;max-width:520px;text-wrap:pretty}
.tgt{margin-top:18px;max-width:520px;font:700 clamp(17px,1.8vw,20px)/1.4 var(--fb);color:var(--ink);text-wrap:balance}
.hero .btn{margin-top:22px}
.ph{position:relative;border-radius:24px;overflow:hidden;border:1.5px solid var(--gold2);aspect-ratio:4/5;box-shadow:0 30px 60px -34px rgba(90,60,20,.45)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:60% 18%}
@media (max-width:760px){.hero{grid-template-columns:1fr}.ph{grid-row:1;max-width:260px;aspect-ratio:1/1;justify-self:center;width:100%}.tx{text-align:center}.lead,.tgt{margin-left:auto;margin-right:auto}}
@media (max-width:760px) and (max-height:700px){.ph{max-width:170px}.w{padding-top:20px;padding-bottom:20px}}
@media (max-width:520px){.hero .btn{display:flex;width:100%;padding-left:20px}}
</style></head><body><main class="w">
<section class="hero"><div class="tx">
<h1>Вы участник <em>VIP-тарифа</em></h1>
<p class="lead">Чек об&nbsp;оплате придёт на&nbsp;электронную почту, которую вы&nbsp;указали при&nbsp;регистрации.</p>
<p class="tgt">Перейдите в&nbsp;Telegram, чтобы завершить регистрацию, получить бонусы и&nbsp;ваш именной&nbsp;билет</p>
<a class="btn" href="https://doctor-saba.com/tlgrm?bot=praktikum_saba_bot"><svg class="tg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.94 4.6l-2.96 13.96c-.22 1-.81 1.24-1.64.77l-4.53-3.34-2.19 2.1c-.24.24-.45.45-.92.45l.33-4.62 8.41-7.6c.37-.32-.08-.5-.57-.18L7.3 13.05l-4.47-1.4c-.97-.3-.99-.97.2-1.44l17.48-6.74c.81-.3 1.52.18 1.26 1.13z"/></svg>Перейти в&nbsp;Telegram<i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></i></a>
</div>
<div class="ph"><img src="img/anna.webp" alt="Анна Саба"></div></section>
</main></body></html>
