  });

  function bindCta(id, event, url) {
    const el = document.getElementById(id);
    el.addEventListener('click', (e) => {
      track(event, { href: el.href });
      if (!url || url.charAt(0) === '#') { e.preventDefault(); openRegister(id); }
    });
  }

  function copyPromo(code) {
    const btn = document.getElementById('copyBtn');
    const done = () => {
      const t = document.getElementById('copyText') || btn;
      t.textContent = CONFIG.offer.copiedLabel;
      btn.classList.add('done');
      setTimeout(() => { t.textContent = CONFIG.offer.copyLabel; btn.classList.remove('done'); }, 1800);
    };
    track('promo_copy', { promo: code });
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, () => fallbackCopy(code, done));
    } else fallbackCopy(code, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) { /* no-op */ }
    document.body.removeChild(ta);
    done();
  }

  // ---------- таймер ----------
  // Отсчёт стартует, когда сам таймер впервые виден на экране хотя бы на 50 %. До этого — полное время.
  // Время старта — в sessionStorage, перезагрузка его не сбрасывает.
  let timerIO = null;
  const timerFull = () => pad2(CONFIG.offer.timerMinutes) + ':00';
  function initTimer() {
    if (timerInt) { clearInterval(timerInt); timerInt = null; }
    if (timerIO) { timerIO.disconnect(); timerIO = null; }
    let start = 0;
    try { start = Number(sessionStorage.getItem(TIMER_KEY)) || 0; } catch (e) { /* no-op */ }
    if (start) { startTimer(start); return; }
    const t2 = document.getElementById('stickyTimer');
    if (t2) { t2.textContent = timerFull(); t2.classList.remove('expired'); }
    const t1 = document.getElementById('timer');
    if (!t1 || !('IntersectionObserver' in window)) { startTimer(0); return; }
    timerIO = new IntersectionObserver((entries) => {
      if (!entries.some(e => e.isIntersecting && e.intersectionRatio >= 0.5)) return;
      timerIO.disconnect(); timerIO = null;
      track('timer_start');
      startTimer(0);
    }, { threshold: [0.5] });
    timerIO.observe(t1);
  }
  function startTimer(start) {
    if (timerInt) clearInterval(timerInt);
    if (!start) {
      start = Date.now();
      try { sessionStorage.setItem(TIMER_KEY, String(start)); } catch (e) { /* no-op */ }
    }
    const end = start + CONFIG.offer.timerMinutes * 60 * 1000;
    const tick = () => {
      const left = Math.max(0, end - Date.now());
      const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      const text = pad2(m) + ':' + pad2(s);
      const t1 = document.getElementById('timer'), t2 = document.getElementById('stickyTimer');
      if (t1) t1.textContent = text;
      if (t2) t2.textContent = text;
      if (left <= 0) { clearInterval(timerInt); timerInt = null; onTimerExpired(); }
    };
    tick();
    if (end > Date.now()) timerInt = setInterval(tick, 1000);
  }
  function onTimerExpired() {
    const t1 = document.getElementById('timer'), note = document.getElementById('timerNote');
    if (t1) t1.classList.add('expired');
    const t2 = document.getElementById('stickyTimer');
    if (t2) t2.classList.add('expired');
    if (note && CONFIG.offer.expiredText) { note.textContent = CONFIG.offer.expiredText; note.hidden = false; }
    // Здесь можно, например, скрыть промокод: document.querySelector('.promo').hidden = true;
  }

  // ---------- липкая панель ----------
  let videoPassed = false, offerVisible = false;
  function updateSticky() {
    const on = videoPassed && !offerVisible;
    const el = document.getElementById('sticky');
    el.classList.toggle('on', on);
    el.setAttribute('aria-hidden', on ? 'false' : 'true');
  }
  function hideSticky(reset) {
    if (reset) { videoPassed = false; offerVisible = false; }
    if (io) { io.disconnect(); io = null; }
    updateSticky();
  }
  function initSticky() {
    hideSticky(true);
    const video = document.getElementById('resHead');
    const offer = document.getElementById('offer');
    if (!('IntersectionObserver' in window)) return;
    io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.target === video) videoPassed = !e.isIntersecting && e.boundingClientRect.top < 0;
        if (e.target === offer) offerVisible = e.isIntersecting;
      });
      updateSticky();
    }, { threshold: 0, rootMargin: '0px 0px -72px 0px' });   // -72px: не считаем оффер видимым, пока он только под панелью
    io.observe(video);
    io.observe(offer);
  }

  // ---------- навигация ----------
  let fastMode = false;

  function go(step) {
    state.step = step;
    saveState();
    render(step);
  }
  function render(step) {
    clearLoaderTimers();
    if (step !== 'result') { fitTicket = null; closePracticumInline(); closeRegister(); if (timerIO) { timerIO.disconnect(); timerIO = null; } }
    if (step === 'intro') renderIntro();
    else if (step === 'match' && CONFIG.match) renderMatch();
    else if (step === 'result') renderResult();
    else if (/^q\d+$/.test(step)) {
      const n = Number(step.slice(1));
      if (n >= 1 && n <= TOTAL) renderQuestion(n); else renderIntro();
    } else if (/^l\d+$/.test(step)) {             // только для debug-панели
      const n = Number(step.slice(1));
      if (CONFIG.loaders[n]) renderLoader(n, () => go(n === TOTAL ? 'result' : 'q' + (n + 1)));
      else renderIntro();
    } else renderIntro();
  }

  // ---------- проверка переполнения (debug) ----------
  function measure() {
    const el = app.querySelector('.screen');
    if (!el) return null;
    const over = Math.max(0, el.scrollHeight - el.clientHeight);
    // «needed» — сколько высоты реально нужно контенту: от верха первого блока до низа последнего + поля.
    // Фото на экране 1 тянется, поэтому считаем его по минимальной высоте — так виден настоящий запас.
    const cs = getComputedStyle(el);
    const kids = Array.from(el.children);
    let needed = el.scrollHeight, photo = null;
    if (kids.length) {
      const rects = kids.map(k => k.getBoundingClientRect());
      const top = Math.min.apply(null, rects.map(r => r.top));
      const bottom = Math.max.apply(null, rects.map(r => r.bottom));
      let extra = 0;
      const ph = el.querySelector('.hero-ph');
      if (ph) {
        photo = Math.round(ph.getBoundingClientRect().height);
        extra = Math.max(0, ph.getBoundingClientRect().height - (parseFloat(getComputedStyle(ph).minHeight) || 0));
      }
      needed = Math.ceil(bottom - top + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) - extra);
    }
    const res = { label: el.dataset.label || '?', scrollHeight: el.scrollHeight, clientHeight: el.clientHeight,
             needed, slack: el.clientHeight - needed, overflow: over };
    if (photo !== null) res.photo = photo;
    return res;
  }
  function afterFixedRender(label) {
    if (!DEBUG) return;
    requestAnimationFrame(() => {
      const m = measure();
      if (!m) return;
      const el = app.querySelector('.screen');
      if (m.overflow > 0) {
        el.classList.add('overflow');
        console.error(label + ' переполнен на ' + m.overflow + ' px');
      } else {
        el.classList.remove('overflow');
        console.log(label + ': ок, нужно ' + m.needed + ' из ' + m.clientHeight + ' px, запас ' + m.slack + ' px' + (m.photo != null ? ', фото ' + m.photo + ' px' : ''));
      }
      const st = document.getElementById('dbgStatus');
      if (st) st.textContent = m.overflow > 0 ? ('ПЕРЕПОЛНЕНИЕ +' + m.overflow + 'px') : ('ок, запас ' + m.slack + 'px');
    });
  }
  // повторная проверка, когда догрузятся веб-шрифты (до них замер идёт по системному шрифту)
  if (DEBUG && document.fonts && document.fonts.addEventListener) {
    document.fonts.addEventListener('loadingdone', () => {
      const el = app.querySelector('.screen');
      if (el && document.body.classList.contains('mode-fixed')) afterFixedRender(el.dataset.label);
    });
  }

  // Прогнать все фиксированные экраны и вернуть замеры (не трогает state пользователя)
  function checkAll() {
    const saved = JSON.stringify(state);
    const results = [];
    const push = () => { const m = measure(); if (m) results.push(m); };
    renderIntro(); push();
    for (let n = 1; n <= TOTAL; n++) { renderQuestion(n); push(); }
    Object.keys(CONFIG.loaders).forEach(n => { renderLoader(Number(n), () => {}, { static: true }); push(); });
    Object.assign(state, JSON.parse(saved));
    render(state.step);
    results.forEach(r => {
      if (r.overflow > 0) console.error(r.label + ' переполнен на ' + r.overflow + ' px');
    });
    return results;
  }

  // «Пройти как Спасательница»: «Замужем» в вопросе 1, первый вариант [S] в вопросах 2–10
  function runAsS() {
    fastMode = true;
    state.answers = {};
    state.status = null;
    let n = 1;
    const stepQ = () => {
      if (n > TOTAL) { fastMode = false; return; }
      renderQuestion(n);
      state.step = 'q' + n; saveState();
      const q = CONFIG.questions[n - 1];
      let idx = n === 1 ? q.options.findIndex(o => o.t === 'Замужем') : q.options.findIndex(o => o.k === 'S');
      if (idx < 0) idx = 0;
      const btn = app.querySelector('.opt[data-idx="' + idx + '"]');
      lock = false;
      setTimeout(() => {
        // select() сам сделает advance() через 300 мс; перехватываем, чтобы идти по цепочке без загрузок
        select(n, idx, btn);
        n++;
        setTimeout(stepQ, 320);
      }, 150);
    };
    stepQ();
  }

  function resetAll() {
    try { sessionStorage.removeItem(SS_KEY); sessionStorage.removeItem(TIMER_KEY); } catch (e) { /* no-op */ }
    state.step = 'intro'; state.answers = {}; state.status = null;
    go('intro');
  }

  // ---------- debug-панель ----------
  function initDebug() {
    const screens = [['intro', 'Экран 1']];
    for (let n = 1; n <= TOTAL; n++) {
      screens.push(['q' + n, 'Вопрос ' + n]);
      if (CONFIG.loaders[n]) screens.push(['l' + n, 'Загрузка после ' + n]);
    }
    screens.push(['result', 'Результат']);
    const bar = document.createElement('div');
    bar.id = 'dbg';
    bar.innerHTML = `
      <button type="button" class="tg" id="dbgToggle">debug</button>
      <select id="dbgGo">${screens.map(s => `<option value="${s[0]}">${s[1]}</option>`).join('')}</select>
      <button type="button" id="dbgCheck">Проверить все</button>
      <button type="button" id="dbgRunS">Пройти как Спасательница</button>
      <button type="button" id="dbgReset">Сброс</button>
      <span class="st" id="dbgStatus"></span>`;
    document.body.appendChild(bar);
    const sel = bar.querySelector('#dbgGo');
    sel.value = state.step;
    sel.addEventListener('change', () => go(sel.value));
    bar.querySelector('#dbgCheck').addEventListener('click', () => {
      const res = checkAll();
      const bad = res.filter(r => r.overflow > 0);
      console.table(res);
      document.getElementById('dbgStatus').textContent = bad.length
        ? ('переполнено: ' + bad.map(b => b.label + ' +' + b.overflow + 'px').join('; '))
        : ('все ' + res.length + ' экранов ок, ' + window.innerWidth + '×' + window.innerHeight);
    });
    bar.querySelector('#dbgRunS').addEventListener('click', runAsS);
    bar.querySelector('#dbgReset').addEventListener('click', resetAll);
    bar.querySelector('#dbgToggle').addEventListener('click', () => bar.classList.toggle('min'));
  }

  // ---------- РЕДАКТОР ТЕКСТОВ (?edit=1) ----------
  // Все строки CONFIG показываются в панели; правки сразу видны на экране и хранятся в localStorage
  // этого браузера. «Скачать index.html» собирает готовый файл с новыми текстами.
  // Редактор открывается любым из способов: ?edit=1, #edit, Ctrl/Cmd+E, 5 быстрых тапов по подписи на фото (экран 1), по счётчику «Вопрос N из 10», по «Ваш результат» или названию результата
  let EDIT = params.get('edit') === '1' || /(^|[#&])edit(=1)?($|&)/.test(location.hash);
  const EDIT_KEY = 'kl_config_edit_v1';
  const GROUP_NAMES = { author: 'Автор', intro: 'Экран 1', questions: 'Вопросы', loaders: 'Экраны загрузки',
    resultScreen: 'Шапка результата', video: 'Видео', results: 'Результаты', offer: 'Оффер', ui: 'Интерфейс', scoring: 'Подсчёт' };
  const FIELD_NAMES = { name: 'имя / название', answers: 'ответы', avatar: 'URL фото в круге (если пусто — портрет)', photoWide: 'URL широкого фото (запас)',
    photoPortrait: 'URL портрета (круг на экране 1 и фон видео)', titleAccent: 'фраза заголовка, выделенная золотом', badge: 'бейдж', title: 'заголовок',
    lead: 'лид', scenarios: 'сценарий', button: 'кнопка', note: 'подпись под кнопкой', text: 'текст', options: 'вариант',
    t: 'текст', k: 'ключ', duration: 'длительность, мс', items: 'пункт', eyebrow: 'надпись сверху', hint: 'подсказка',
    embedUrl: 'URL видео', promo: 'промокод', parts: 'часть', heading: 'заголовок', blocks: 'блок', quotes: 'цитата',
    subtitle: 'подзаголовок', locked: 'пункт', practicumIntro: 'текст о практикуме', practicumName: 'название практикума',
    promoText: 'текст о промокоде', copyLabel: 'кнопка копирования', copiedLabel: 'после копирования', timerMinutes: 'таймер, минут',
    expiredText: 'после истечения таймера', mainButton: 'основная кнопка', mainUrl: 'URL основной кнопки (#register — попап регистрации)',
    registerTitle: 'попап: заголовок', registerName: 'попап: название практикума', registerDates: 'попап: даты', registerNote: 'попап: подпись под заголовком', registerButton: 'попап: кнопка формы',
    secondaryButton: 'вторичная кнопка', secondaryUrl: 'URL вторичной кнопки', back: 'подпись «Назад»', counter: 'счётчик вопросов',
    progressStart: 'прогресс на 1-м вопросе, %', progressEnd: 'прогресс на последнем, %', priority: 'приоритет', tone: 'тон (good/bad)', type: 'тип блока' };

  function deepMerge(dst, src) {
    Object.keys(src).forEach(k => {
      if (src[k] && typeof src[k] === 'object' && dst[k] && typeof dst[k] === 'object') deepMerge(dst[k], src[k]);
      else dst[k] = src[k];
    });
  }
  function getPath(obj, path) { return path.reduce((o, k) => (o == null ? o : o[k]), obj); }
  function setPath(obj, path, val) { const last = path[path.length - 1]; getPath(obj, path.slice(0, -1))[last] = val; }

  // Путь в CONFIG → понятная подпись: questions.5.options.2.t → «вопрос 6 → вариант 3 → текст»
  function labelFor(path) {
    const out = [];
    path.forEach((k, i) => {
      const prev = path[i - 1];
      if (prev === 'loaders') out.push('после вопроса ' + k);
      else if (/^\d+$/.test(String(k))) {
        const n = Number(k) + 1;
        if (prev === 'questions') out.push('вопрос ' + n);
        else { out.pop(); out.push((FIELD_NAMES[prev] || prev) + ' ' + n); }
      }
      else if (prev === 'results') out.push('результат ' + k);
      else if (!(i === 0 && GROUP_NAMES[k])) out.push(FIELD_NAMES[k] || k);
    });
    return out.join(' → ');
  }

  function buildEditor() {
    const panel = document.createElement('div');
    panel.id = 'edit';
    panel.innerHTML = `
      <div class="edit-bar">
        <b>Редактор текстов</b>
        <button type="button" id="editToggle">свернуть</button>
        <button type="button" id="editDownload" class="primary">Скачать index.html</button>
        <button type="button" id="editCopy">Скопировать index.html</button>
        <button type="button" id="editReset">Сбросить правки</button>
        <button type="button" id="editRestart">Начать тест заново</button>
        <span class="edit-hint">Правки видны сразу и сохраняются в этом браузере. Чтобы они попали на сайт — скачайте файл и замените им index.html.</span>
      </div>
      <div class="edit-body"></div>`;
    document.body.appendChild(panel);
    const body = panel.querySelector('.edit-body');

    const walk = (obj, path, into) => {
      Object.keys(obj).forEach(k => {
        const v = obj[k], p = path.concat(k);
        if (v && typeof v === 'object') { walk(v, p, into); return; }
        if (typeof v !== 'string' && typeof v !== 'number') return;
        const row = document.createElement('label');
        row.className = 'edit-row';
        const long = typeof v === 'string' && (v.length > 48 || /<b/.test(v));
        row.innerHTML = `<span class="edit-label">${esc(labelFor(p))}</span>` +
          (long ? `<textarea rows="${Math.min(8, Math.ceil(v.length / 55) + 1)}"></textarea>`
                : `<input type="${typeof v === 'number' ? 'number' : 'text'}">`);
        const field = row.querySelector('textarea,input');
        field.value = v;
        field.addEventListener('input', () => {
          setPath(CONFIG, p, typeof v === 'number' ? Number(field.value) : field.value);
          try { localStorage.setItem(EDIT_KEY, JSON.stringify(CONFIG)); } catch (e) { /* no-op */ }
          scheduleRerender();
        });
        into.appendChild(row);
      });
    };
    Object.keys(CONFIG).forEach(group => {
      const d = document.createElement('details');
      d.open = group === 'intro';
      d.innerHTML = `<summary>${esc(GROUP_NAMES[group] || group)}</summary>`;
      walk(CONFIG[group], [group], d);
      body.appendChild(d);
    });
    document.body.classList.add('editing');

    let rr = 0;
    function scheduleRerender() {
      clearTimeout(rr);
      rr = setTimeout(() => { const y = window.scrollY; render(state.step); window.scrollTo(0, y); }, 250);
    }
    panel.querySelector('#editToggle').addEventListener('click', (e) => {
      panel.classList.toggle('min');
      e.target.textContent = panel.classList.contains('min') ? 'развернуть' : 'свернуть';
    });
    panel.querySelector('#editReset').addEventListener('click', () => {
      if (!confirm('Убрать все правки, сделанные в этом браузере, и вернуть тексты из файла?')) return;
      try { localStorage.removeItem(EDIT_KEY); } catch (e) { /* no-op */ }
      location.reload();
    });
    panel.querySelector('#editDownload').addEventListener('click', downloadHtml);
    panel.querySelector('#editRestart').addEventListener('click', resetAll);
    panel.querySelector('#editCopy').addEventListener('click', (e) => {
      const html = buildHtml(); if (!html) return;
      const done = () => { e.target.textContent = 'Скопировано — вставьте в index.html'; setTimeout(() => { e.target.textContent = 'Скопировать index.html'; }, 2500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(html).then(done, () => fallbackCopy(html, done));
      else fallbackCopy(html, done);
    });
  }

  // Собираем новый index.html: текущая разметка + CONFIG с правками вместо исходного
  function buildHtml() {
    const root = document.documentElement.cloneNode(true);
    const bodyEl = root.querySelector('body');
    bodyEl.className = 'mode-fixed';
    root.removeAttribute('style');
    root.querySelector('#app').innerHTML = '';
    ['#edit', '#dbg', '#rg', '#practicum'].forEach(s => { const el = root.querySelector(s); if (el) el.remove(); });
    root.className = root.className.replace(/\b(h-[\w-]+|rg-open)\b/g, '').trim();
    if (!root.className) root.removeAttribute('class');
    const st = root.querySelector('#sticky'); if (st) { st.className = 'sticky'; st.setAttribute('aria-hidden', 'true'); }
    const stt = root.querySelector('#stickyBtnText'); if (stt) stt.textContent = '';
    const script = root.querySelector('script');
    const src = script.textContent;
    const start = src.indexOf('const CONFIG = {');
    const end = src.indexOf('\n};', start) + 3;
    if (start < 0 || end < 3) { alert('Не нашёл блок CONFIG в исходнике'); return ''; }
    const json = JSON.stringify(CONFIG, null, 2);
    script.textContent = src.slice(0, start) + 'const CONFIG = ' + json + ';' + src.slice(end);
    return '<!DOCTYPE html>\n' + root.outerHTML;
  }
  function downloadHtml() {
    const html = buildHtml(); if (!html) return;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ---------- старт ----------
  if (EDIT) {
    try { const saved = localStorage.getItem(EDIT_KEY); if (saved) deepMerge(CONFIG, JSON.parse(saved)); } catch (e) { /* no-op */ }
  }
  loadState();
  if (PREVIEW) state.step = 'result';
  track('quiz_open');
  render(state.step);
  if (DEBUG) {
    initDebug();
    window.__kl = { go, checkAll, runAsS, resetAll, measure, state, CONFIG, computeResult };
  }
  if (EDIT) buildEditor();

  function openEditor() {
    if (document.getElementById('edit')) return;
    EDIT = true;
    try { const saved = localStorage.getItem(EDIT_KEY); if (saved) deepMerge(CONFIG, JSON.parse(saved)); } catch (e) { /* no-op */ }
    render(state.step);
    buildEditor();
  }
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e') { e.preventDefault(); openEditor(); }
  });
  window.addEventListener('hashchange', () => { if (/edit/.test(location.hash)) openEditor(); });
  let taps = [];
  app.addEventListener('click', (e) => {
    if (!e.target.closest('.author, .eyebrow, .res-title, .qcount, .load-title')) return;
    const now = Date.now();
    taps = taps.filter(t => now - t < 2500).concat(now);
    if (taps.length >= 5) { taps = []; openEditor(); }
  });
  if (DEBUG) window.__kl.openEditor = openEditor;
})();
</script>
</body>
