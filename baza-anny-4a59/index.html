<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>База Анны Саба: референсы, матрицы, Белова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f6f3ee;font-family:Manrope,system-ui,sans-serif;color:#1d1b19}
body{display:flex;flex-direction:column;height:100dvh}
nav{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#1d1b19;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav .brand{color:#e9d9c1;font-weight:700;font-size:14px;white-space:nowrap;padding:0 8px 0 4px}
nav a{flex:none;color:#e8e2da;text-decoration:none;font-size:14px;font-weight:500;padding:8px 13px;border-radius:999px;white-space:nowrap;transition:background .15s}
nav a:hover{background:#3a3631}
nav a.on{background:#e9d9c1;color:#1d1b19;font-weight:700}
nav a.ext{margin-left:auto;font-size:13px;color:#b9b0a5}
main{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
@media (max-width:520px){nav .brand{display:none}nav a{padding:8px 11px;font-size:13.5px}}
</style>
</head>
<body>
<nav id="nav">
  <span class="brand">База Анны Саба</span>
  <a data-id="referensy" href="#referensy">Референсы</a>
  <a data-id="matrica-1" href="#matrica-1">Матрица&nbsp;1</a>
  <a data-id="matrica-2" href="#matrica-2">Матрица&nbsp;2</a>
  <a data-id="belova" href="#belova">Белова</a>
  <a data-id="kora" href="#kora">Кора: разбор</a>
  <a class="ext" id="ext" href="#" target="_blank" rel="noopener">Открыть отдельно&nbsp;↗</a>
</nav>
<main><iframe id="f" title="Раздел базы" allow="clipboard-write"></iframe></main>
<script>
// One address for all of Anna's working pages: each tab loads the live page, nothing is copied.
const P = {
  'referensy': 'https://baza.serenkov.com/refs/yJh8P3yUj1dG/',
  'matrica-1': '/matrica-rilsov/',
  'matrica-2': '/matrica-rilsov-2/',
  'belova': '/refs-belova-5k8n/',
  'kora': '/kora-razbor-7c2e/'
};
const f = document.getElementById('f'), ext = document.getElementById('ext');
function show() {
  let id = location.hash.slice(1);
  if (!P[id]) id = 'referensy';
  if (f.dataset.id !== id) { f.dataset.id = id; f.src = P[id]; }
  ext.href = P[id];
  document.querySelectorAll('nav a[data-id]').forEach(a => {
    const on = a.dataset.id === id; a.classList.toggle('on', on);
    if (on) a.scrollIntoView({block: 'nearest', inline: 'nearest'});
  });
  document.title = document.querySelector('nav a.on').textContent + ' – база Анны Саба';
}
addEventListener('hashchange', show); show();
</script>
</body>
</html>
