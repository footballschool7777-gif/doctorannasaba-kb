<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Программа обучения · Анна Саба</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1514;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.stage{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center;padding:12px}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.45);user-select:none;-webkit-user-drag:none}
.bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;gap:18px;color:#a9c7c4;font-size:15px}
.bar button{width:44px;height:36px;border:0;border-radius:10px;background:#0d5c58;color:#fff;font-size:20px;cursor:pointer}
.bar button:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:#2b4745;cursor:pointer}
.dots i.on{background:#f3c64d}
@media print{html,body{overflow:visible;height:auto;background:#fff}.stage{position:static;display:block;padding:0}.stage img{display:block!important;page-break-after:always;box-shadow:none;border-radius:0;width:100%;max-height:none}.bar{display:none}}
</style></head>
<body>
<div class="stage" id="st"></div>
<div class="bar"><button id="pv" aria-label="Назад">‹</button><div class="dots" id="dots"></div><span id="num"></span><button id="nx" aria-label="Вперёд">›</button></div>
<script>
var N=7,cur=0,st=document.getElementById('st'),dots=document.getElementById('dots'),num=document.getElementById('num');
for(var i=1;i<=N;i++){var im=new Image();im.src='s/'+i+'.jpg';im.alt='Слайд '+i;im.style.display='none';st.appendChild(im);var d=document.createElement('i');d.dataset.i=i-1;d.onclick=function(){go(+this.dataset.i)};dots.appendChild(d)}
function go(n){cur=Math.max(0,Math.min(N-1,n));var m=st.children;for(var i=0;i<N;i++){m[i].style.display=i==cur?'block':'none';dots.children[i].className=i==cur?'on':''}
num.textContent=(cur+1)+' / '+N;document.getElementById('pv').disabled=cur==0;document.getElementById('nx').disabled=cur==N-1;history.replaceState(null,'','#'+(cur+1))}
document.getElementById('pv').onclick=function(){go(cur-1)};document.getElementById('nx').onclick=function(){go(cur+1)};
document.onkeydown=function(e){if(e.key=='ArrowRight'||e.key==' '||e.key=='PageDown')go(cur+1);if(e.key=='ArrowLeft'||e.key=='PageUp')go(cur-1)};
var x0=null;document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX});document.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));x0=null});
st.onclick=function(e){go(cur+(e.clientX>innerWidth/2?1:-1))};
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
