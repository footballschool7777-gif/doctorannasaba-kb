<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Мастер-группа «Интегративный подход в практике психолога»</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#141414;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center;padding:12px}
.slide{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.45);user-select:none;-webkit-user-drag:none}
.bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;gap:14px;background:#1d1d1d;border-top:1px solid #2a2a2a}
.bar button{background:#2a2a2a;color:#fff;border:0;border-radius:8px;height:38px;min-width:44px;padding:0 14px;font-size:18px;cursor:pointer}
.bar button:hover{background:#e8a93a;color:#141414}
.count{min-width:70px;text-align:center;font-size:15px;color:#ddd;font-variant-numeric:tabular-nums}
.prog{position:fixed;left:0;bottom:56px;height:3px;background:#e8a93a;transition:width .3s ease}
.nav{position:fixed;top:0;bottom:56px;width:22%;cursor:pointer;z-index:2}
.nav.l{left:0}.nav.r{right:0}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="nav l" id="navL" aria-hidden="true"></div>
<div class="nav r" id="navR" aria-hidden="true"></div>
<div class="prog" id="prog"></div>
<div class="bar">
  <button id="prev" aria-label="Предыдущий слайд">←</button>
  <div class="count" id="count">1 / 19</div>
  <button id="next" aria-label="Следующий слайд">→</button>
  <button id="fs" aria-label="Во весь экран" title="Во весь экран"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<script>
(function(){
  var N=19, stage=document.getElementById('stage'), cur=0, slides=[];
  for(var i=1;i<=N;i++){
    var d=document.createElement('div');d.className='slide';
    var im=document.createElement('img');
    im.src='s/'+(i<10?'0':'')+i+'.jpg';im.alt='Слайд '+i;im.loading=i<=2?'eager':'lazy';im.decoding='async';
    d.appendChild(im);stage.appendChild(d);slides.push(d);
  }
  function show(n){
    cur=Math.max(0,Math.min(N-1,n));
    slides.forEach(function(s,k){s.classList.toggle('on',k===cur)});
    document.getElementById('count').textContent=(cur+1)+' / '+N;
    document.getElementById('prog').style.width=((cur+1)/N*100)+'%';
    if(cur+1<N){var pre=slides[cur+1].querySelector('img');pre.loading='eager';}
    history.replaceState(null,'','#'+(cur+1));
  }
  var h=parseInt(location.hash.slice(1),10);show(h>0?h-1:0);
  function next(){show(cur+1)} function prev(){show(cur-1)}
  document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
  document.getElementById('navR').onclick=next;document.getElementById('navL').onclick=prev;
  document.getElementById('fs').onclick=function(){
    var el=document.documentElement;
    if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el)}
    else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  };
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
    else if(e.key==='Home'){show(0)}else if(e.key==='End'){show(N-1)}
  });
  var x0=null;
  document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',function(e){
    if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>40){dx<0?next():prev()}x0=null;
  },{passive:true});
})();
</script>
</body>
</html>
